<div id="app">
    <!-- ───────────── Sidebar ───────────── -->
    <aside class="sidebar">
        <header class="brand">
            <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
            <span class="brand-name">Search<em>Magnet</em></span>
        </header>

        <nav id="nav" aria-label="Main navigation"></nav>

        <section class="stats-card" aria-label="Index statistics">
            <h3>Index Stats</h3>
            <dl>
                <div><dt>Total Files</dt><dd id="stat-files">–</dd></div>
                <div><dt>Total Size</dt><dd id="stat-size">–</dd></div>
                <div><dt>Embeddings</dt><dd id="stat-embeddings">–</dd></div>
                <div><dt>Last Updated</dt><dd id="stat-updated">–</dd></div>
            </dl>
        </section>

        <footer class="sidebar-footer">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
                <svg class="icon"><use href="#i-moon"/></svg>
                <span>Dark Mode</span>
                <span class="switch"><span class="knob"></span></span>
            </button>
        </footer>
    </aside>

    <!-- ───────────── Main content ───────────── -->
    <main id="view" tabindex="-1"></main>
</div>

<div id="toasts" aria-live="polite"></div>
